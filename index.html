<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АвтоправоНСК</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <header>
           <h1>🚗 АвтоправоНСК</h1>
        </header>

        <main class="main-buttons">
            <button class="btn btn-blue" onclick="showService('tow-truck')">Эвакуатор</button>
            <button class="btn btn-blue" onclick="showService('commissioner')">Аварийный комиссар</button>
            <button class="btn btn-blue" onclick="showService('lawyer')">Автоюрист</button>
            <button class="btn btn-white" onclick="showService('dtp-guide')">Что делать при ДТП</button>
        </main>

        <div id="service-content"></div>

        <footer>
            <p>ⓒ 2025 АвтоправоНСК. Ваш помощник на дорогах.</p>
            <p style="font-size: 0.8rem; color: #888; margin-top: 10px;">
                Все контакты актуальны. Просто нажмите для звонка.
            </p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
